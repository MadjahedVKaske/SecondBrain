name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: SSH and deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          set -e
          cd /var/www/buro1.tech
          git remote set-url origin https://github.com/MadjahedVKaske/SecondBrain.git || true
          git fetch origin main
          git reset --hard origin/main
          npm install
          npm run build

          cd /var/www/buro1.tech/yakor-agent
          npm install --omit=dev
          if command -v pm2 >/dev/null 2>&1; then
            export YAKOR_AGENT_TOKEN="${{ secrets.YAKOR_AGENT_TOKEN }}"
            export HOST=127.0.0.1
            export PORT=3100
            pm2 delete yakor-agent >/dev/null 2>&1 || true
            pm2 start server.js --name yakor-agent --cwd /var/www/buro1.tech/yakor-agent
            pm2 save
          else
            echo "WARN: pm2 not found — start yakor-agent manually"
          fi
